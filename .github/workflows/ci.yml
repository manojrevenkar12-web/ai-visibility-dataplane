name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: avd, POSTGRES_PASSWORD: avd, POSTGRES_DB: avd_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env: { CLICKHOUSE_SKIP_USER_SETUP: "1" }
        ports: ["8123:8123"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://avd:avd@127.0.0.1:5432/avd_test
      CLICKHOUSE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bunx biome check src test
      - run: bun test --timeout 60000

  drills:
    # the fault drills against real ClickHouse; the gate fails if any run is lost or counted twice
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: avd, POSTGRES_PASSWORD: avd, POSTGRES_DB: avd }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env: { CLICKHOUSE_SKIP_USER_SETUP: "1" }
        ports: ["8123:8123"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run src/cmd/drill.ts
      - run: bun run src/cmd/gate.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: drills, path: reports/ }

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t avd .
