# Local stack: Postgres, Redis, ClickHouse, the four data-plane processes, the provider simulator,
# Prometheus and Grafana (dashboards and alert rules from deploy/).
#   docker compose up -d --build && docker compose run --rm migrate && docker compose run --rm seed
x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgres://avd:avd@postgres:5432/avd
    REDIS_URL: redis://redis:6379/0
    CLICKHOUSE_URL: http://clickhouse:8123
    PROVIDER_BASE_URL: http://sim:7070
  depends_on: [postgres, redis, clickhouse]
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: avd, POSTGRES_PASSWORD: avd, POSTGRES_DB: avd }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment: { CLICKHOUSE_SKIP_USER_SETUP: "1" }
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
  migrate:
    <<: *app
    profiles: [tools]
    command: ["bun", "run", "src/cmd/migrate.ts"]
  seed:
    <<: *app
    profiles: [tools]
    command: ["bun", "run", "src/cmd/seed.ts"]
  sim:
    <<: *app
    command: ["bun", "run", "src/cmd/sim.ts"]
  api:
    <<: *app
    command: ["bun", "run", "src/cmd/api.ts"]
    ports: ["3000:3000"]
  worker:
    <<: *app
    command: ["bun", "run", "src/cmd/worker.ts"]
    deploy: { replicas: 2 }
  scheduler:
    <<: *app
    command: ["bun", "run", "src/cmd/scheduler.ts"]
  shipper:
    <<: *app
    command: ["bun", "run", "src/cmd/shipper.ts"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
